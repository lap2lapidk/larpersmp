# ============================================================
#  SMPCore configuration
#  Colors use & codes. Reload with /smpcore reload
# ============================================================

scoreboard-title: "&6&lSMP"
scoreboard-footer: "&eplay.yourserver.net"

starting-balance: 1000
kill-reward: 100

# Given to a player the first time they join
starter-kit:
  - {material: BREAD, amount: 16}
  - {material: STONE_PICKAXE, amount: 1}
  - {material: STONE_AXE, amount: 1}
  - {material: TORCH, amount: 16}

teleport:
  warmup-seconds: 3          # staff (mod+) skip the warmup
  tpa-timeout-seconds: 60

rtp:
  world: world
  min-radius: 500
  max-radius: 5000
  cooldown-seconds: 30       # staff (mod+) skip the cooldown

auction:
  tax-percent: 5
  duration-hours: 48
  max-listings: 10
  min-price: 1
  max-price: 1000000000

# ------------------------------------------------------------
#  Progression map
#  Member tiers are earned automatically through playtime.
#  Each tier pays its reward once, raises the home limit and
#  adds a bonus to everything sold with /sell.
#  (Mods get +2 homes, admins get +50.)
# ------------------------------------------------------------
progression:
  tiers:
    - {name: Newcomer, hours: 0,   reward: 0,      max-homes: 2,  sell-bonus: 0,  icon: WOODEN_PICKAXE,    color: "&7"}
    - {name: Regular,  hours: 2,   reward: 2500,   max-homes: 3,  sell-bonus: 5,  icon: STONE_PICKAXE,     color: "&a"}
    - {name: Veteran,  hours: 10,  reward: 10000,  max-homes: 5,  sell-bonus: 10, icon: IRON_PICKAXE,      color: "&b"}
    - {name: Elite,    hours: 30,  reward: 50000,  max-homes: 8,  sell-bonus: 20, icon: DIAMOND_PICKAXE,   color: "&d"}
    - {name: Legend,   hours: 100, reward: 250000, max-homes: 12, sell-bonus: 35, icon: NETHERITE_PICKAXE, color: "&6"}
  # Text shown on the staff ladder at the bottom of /progress
  staff-ladder:
    member:
      - "&7Everyone starts here."
      - "&7Play to climb the tier map above."
      - "&7Unlocks homes, /sell bonuses and rewards."
    mod:
      - "&7Granted by an admin to trusted members."
      - "&7/mute /unmute /kick /vanish /sc /invsee /stp"
      - "&7No teleport warmup or cooldowns, +2 homes."
    admin:
      - "&7Granted by the server owner only."
      - "&7Everything mods can do, plus /ban /unban"
      - "&7/rank /eco /setspawn /setwarp and more."

# Extra permission nodes applied per rank (ranks stack: admin = member + mod + admin).
# Prefix a node with "-" to deny it.
rank-permissions:
  member: []
  mod:
    - minecraft.command.teleport
    - minecraft.command.tp
  admin:
    - minecraft.command.gamemode
    - minecraft.command.give
    - minecraft.command.time
    - minecraft.command.weather
    - minecraft.command.kill
    - minecraft.command.effect
    - minecraft.command.clear

