# ------------------------------------------------------------
#  Shards (second currency)
#  Earned by playing and by killing players. Spend them in
#  /shardshop and on spawners in /spawnershop.
# ------------------------------------------------------------
shards:
  starting: 0              # shards a brand new player begins with
  per-kill: 1              # shards for killing another player
  playtime-minutes: 10     # earn shards every N minutes online (0 = off)
  playtime-amount: 1       # how many shards each time
  # price = shards. Optional: name (display), command (run by console instead of
  # giving the item; %player% is replaced). Max 45 offers.
  shop:
    - {material: DIAMOND, amount: 16, price: 20}
    - {material: EXPERIENCE_BOTTLE, amount: 64, price: 30}
    - {material: ENDER_PEARL, amount: 16, price: 25}
    - {material: GOLDEN_APPLE, amount: 8, price: 30}
    - {material: TOTEM_OF_UNDYING, amount: 1, price: 60}
    - {material: ENCHANTED_GOLDEN_APPLE, amount: 1, price: 150}
    - {material: NETHERITE_INGOT, amount: 1, price: 250}
    - {material: ELYTRA, amount: 1, price: 800}
    - {material: GOLD_INGOT, name: "&a$100,000 Cash", amount: 1, price: 100, command: "eco give %player% 100000"}

# ------------------------------------------------------------
#  Spawners
#  price  = money cost (0 = not sold for money)
#  shards = shard cost (0 = not sold for shards)
#  Any spawnable living mob works (type = vanilla entity name). Max 45 entries.
#  Left-click buys with money, right-click buys with shards.
# ------------------------------------------------------------
spawners:
  silk-touch-pickup: true   # a Silk Touch tool picks a spawner up and keeps its mob
  shop:
    - {type: PIG,               price: 25000,  shards: 30}
    - {type: COW,               price: 30000,  shards: 35}
    - {type: CHICKEN,           price: 25000,  shards: 30}
    - {type: SHEEP,             price: 30000,  shards: 35}
    - {type: ZOMBIE,            price: 75000,  shards: 90}
    - {type: SKELETON,          price: 100000, shards: 120}
    - {type: SPIDER,            price: 75000,  shards: 90}
    - {type: CAVE_SPIDER,       price: 60000,  shards: 70}
    - {type: CREEPER,           price: 125000, shards: 150}
    - {type: WITCH,             price: 150000, shards: 180}
    - {type: MAGMA_CUBE,        price: 150000, shards: 180}
    - {type: ZOMBIFIED_PIGLIN,  price: 200000, shards: 240}
    - {type: BLAZE,             price: 250000, shards: 300}
    - {type: ENDERMAN,          price: 300000, shards: 360}
    - {type: IRON_GOLEM,        price: 500000, shards: 600}
